<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國王戰爭 V2 基礎對戰測試</title><style>
:root{color-scheme:dark;--ink:#fff7ef;--muted:#c5b8ce;--gold:#e9c78b;--line:#806d91;--panel:rgba(37,27,60,.88)}
*{box-sizing:border-box}body{font-family:"Noto Sans TC",system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:24px 18px 60px;background:radial-gradient(ellipse at 70% 0%,#53406c 0%,transparent 42%),radial-gradient(ellipse at 0% 65%,#323b67 0%,transparent 42%),#151324;color:var(--ink);line-height:1.6}
h1{font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:.08em;color:#ffe6b5;text-shadow:0 3px 22px #bb83c36b}h2,h3{color:#f6dfbc;margin:.2em 0 .6em}section{background:var(--panel);border:1px solid #a68cb66b;box-shadow:0 12px 30px #0b091d55,inset 0 1px #ffffff1c;padding:20px;border-radius:18px;margin:15px 0;backdrop-filter:blur(9px)}
button,input,select{font:inherit;padding:10px 13px;margin:4px;border-radius:10px;border:1px solid #b69dbb;background:#2d2442;color:var(--ink);max-width:100%}input{background:#1c1930}button{cursor:pointer;transition:transform .15s,border-color .15s,background .15s}button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);background:#49375f}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f4c77c;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.card{display:inline-flex;align-items:center;min-height:74px;padding:14px 17px;border:1px solid #c2a2bd;border-radius:14px;margin:6px;background:linear-gradient(145deg,#554268,#2d2546 65%,#25213e);box-shadow:inset 0 1px #ffffff36,0 4px 14px #100b1c66;text-align:left;cursor:pointer;white-space:normal}.selected{outline:3px solid #f5d493;box-shadow:0 0 18px #f6d59a70}.muted{color:var(--muted)}#error{color:#ffb9b9;min-height:1.2em}
@media(max-width:640px){body{padding:14px 10px 36px}section{padding:13px}.card{min-height:60px;padding:10px 12px;margin:4px}button,input,select{font-size:14px}}
@media(prefers-reduced-motion:reduce){button{transition:none}button:hover:not(:disabled){transform:none}}
#battle-hud{display:none;position:sticky;top:6px;z-index:4;padding:10px 14px;margin:12px 0;border:1px solid #c5a575;border-radius:14px;background:#29223af5;box-shadow:0 6px 18px #0007}#battle-hud .hud-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}#hud-turn{font-weight:800;color:#ffe0a8}#hud-status,#hud-players{font-size:.87rem;color:#e7d4ec}#game .field-zone{border:1px solid #957aa280;background:#ffffff0b;padding:9px;border-radius:10px;min-height:78px}#game .player-identity{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}#game .hp-display{font-weight:700;color:#ffc3c6;background:#632f4670;padding:4px 10px;border-radius:10px}#game .action-help{background:#d5bb8530;border-left:3px solid #e2c48c;padding:8px 11px;border-radius:5px}#game .phase-label{color:#e9c78b;font-weight:700;letter-spacing:.04em}#game .hand-area .card{border-color:#e9c78b}@media(max-width:640px){#battle-hud{top:0}#game .field-zone{padding:4px}#game .card{font-size:.86rem}#game .player-identity h2{font-size:1.05rem}}#game .class-legend{display:flex;gap:8px;flex-wrap:wrap}#game .class-legend span{border:1px solid #b79771;border-radius:10px;padding:5px 10px;background:#312b49}#magic-choice{border:2px solid #b9a1e3;background:linear-gradient(135deg,#242a4c,#37254a);scroll-margin-top:100px}#magic-choice .spell-grid{display:flex;flex-wrap:wrap;gap:8px}#magic-choice .spell-picked{outline:3px solid #e1c6ff;background:#57426e}#magic-choice .spell-step{color:#efd7ff;font-weight:700}#magic-choice button{min-height:44px}#tactic-choice{border:2px solid #c8b281;background:linear-gradient(130deg,#352b51,#25243d)}#tactic-choice .tactic-grid{display:flex;gap:7px;flex-wrap:wrap}#tactic-choice .tactic-selected{outline:3px solid #f7d382;background:#66507b}#tactic-choice .tactic-step{margin:10px 0;color:#f8e7c7}#tactic-choice button{min-height:44px}#end-choice{border:2px solid #d7b777;background:#312743;scroll-margin-top:100px}#end-choice .choice-card{min-width:124px;max-width:230px}#end-choice .picked{outline:3px solid #ffc875;background:#62476a}#end-choice .choice-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#end-choice .choice-controls button{min-width:120px}#end-choice .choice-progress{font-weight:700;color:#ffe0a8}</style><h1>國王戰爭 V2｜2–5 人對戰測試</h1><p class="muted">開發測試版：部署、兵種戰鬥、攻擊國王、補牌、勝負判定。九種魔法已開放測試；尚未包含完整介面；國王能力已提供初步操作。</p><section><input id="name" placeholder="玩家名稱" value="測試玩家"><select id="king"><option>亞歷山大大帝</option><option>屋大維奧古斯都</option><option>成吉思汗</option><option>秦始皇</option><option>路易十四</option></select><button onclick="create()">建立房間</button><input id="code" placeholder="房間代碼"><button onclick="join()">加入房間</button><button onclick="start()">開始對戰</button><div id="error" role="alert" aria-live="assertive"></div></section><aside id="battle-hud" aria-live="polite"><div class="hud-row"><span id="hud-turn"></span><span id="hud-status"></span><span id="hud-players"></span></div></aside><div id="game"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io('/v2-playtest');const legacyMode=new URLSearchParams(location.search).get('legacy')==='1';let state=null,selected=null,endDraft=null,tacticDraft=null,magicDraft=null;
const resumeKey='kw_v2_resume';
function storeSeat(code,resumeToken){if(code&&resumeToken)sessionStorage.setItem(resumeKey,JSON.stringify({code,resumeToken}))}
function resumeSeat(){let saved;try{saved=JSON.parse(sessionStorage.getItem(resumeKey)||'null')}catch{return}if(!saved?.code||!saved?.resumeToken)return;socket.emit('v2:resume',saved,r=>{if(r?.ok){document.querySelector('#code').value=r.code;storeSeat(r.code,r.resumeToken);document.querySelector('#error').textContent='已恢復遊戲連線'}else{document.querySelector('#error').textContent='無法恢復原對局：'+(r?.error||'請重新加入')}})}

const KING_INFO={'亞歷山大大帝':'每回合一次：兵種戰鬥時攻擊戰力 +1（點擊敵方兵種時選擇）','屋大維奧古斯都':'被動：戰力相同的兵種戰鬥中，己方防守兵種存活並進入半整備','成吉思汗':'每回合一次：交換一張場上兵種與一張手牌；換入兵種本回合不可行動','秦始皇':'每次回合結束時額外抽一張兵種，從新抽三張牌選一張放回牌庫底','路易十四':'每回合一次：犧牲回合開始時已在場上的一名兵種，恢復國王 3 HP（不超過 24）'};
function send(event,data){socket.emit(event,{...data,code:document.querySelector('#code').value},r=>{if(!r?.ok)document.querySelector('#error').textContent=r?.error||'操作失敗';else document.querySelector('#error').textContent='';if(r?.code)document.querySelector('#code').value=r.code;if(r?.ok&&r?.resumeToken)storeSeat(r.code||document.querySelector('#code').value,r.resumeToken)})}
function create(){send('v2:create',{name:document.querySelector('#name').value,king:document.querySelector('#king').value})}function join(){send('v2:join',{name:document.querySelector('#name').value,king:document.querySelector('#king').value})}function start(){send('v2:start',{})}
function safe(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function typeLabel(type){return ({'弓兵':'刺客','法師':'魔法師'})[type]||type}function classEmblem(type){return ({'步兵':'🛡️','弓兵':'🗡️','刺客':'🗡️','法師':'🔮','魔法師':'🔮','騎兵':'🐎'})[type]||'⚔️'}function unitArtId(u){const type=({'步兵':'infantry','弓兵':'assassin','刺客':'assassin','法師':'mage','魔法師':'mage','騎兵':'cavalry'})[u.type];const rank=({'初級':'basic','中級':'intermediate','高級':'advanced'})[u.rank];return type&&rank?type+'-'+rank:'unmapped'}function card(u,i,action){return '<button data-art-id="'+safe(unitArtId(u))+'" class="card '+(selected===i&&action==='select'?'selected':'')+'" onclick="'+action+'('+i+')">'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'｜戰力 '+( ({初級:1,中級:2,高級:3}[u.rank]||0)+(u.modifier||0))+(u.halfReadyUntilOwnerTurn?'（半整備）':'')+(u.tapped?'（已行動）':'')+(u.status?.length?'｜狀態：'+safe([...new Set(u.status)].join('、')):'')+'</button>'}
function select(i){selected=i;render()}function deploy(i){if(!state||state.status!=='playing'||state.current!==state.you)return;const me=state.players[state.you];if(me.field.length>=3){document.querySelector('#error').textContent='場上最多 3 名兵種；請先攻擊或結束回合。';return}send('v2:deploy',{index:i})}function hit(i,defenderPlayerIndex){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected,defenderIndex:i,defenderPlayerIndex,alexander:state.players[state.you].king==='亞歷山大大帝'&&!state.players[state.you].abilityUsed&&confirm('使用亞歷山大 +1 戰力？')});selected=null}function kingHit(defenderPlayerIndex){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected,defenderPlayerIndex});selected=null}function ability(){if(!state)return;const me=state.players[state.you];if(me.king==='路易十四'){const raw=prompt('犧牲哪一張場上兵種？輸入 1 起算的序號');if(raw===null)return;const i=Number(raw);if(Number.isInteger(i)&&i>=1&&i<=me.field.length)send('v2:ability',{fieldIndex:i-1})}else if(me.king==='成吉思汗'){const fr=prompt('交換場上兵種序號（從 1 開始）');if(fr===null)return;const hr=prompt('交換手牌序號（從 1 開始）');if(hr===null)return;const f=Number(fr),h=Number(hr);if(Number.isInteger(f)&&Number.isInteger(h)&&f>=1&&f<=me.field.length&&h>=1&&h<=me.hand.length)send('v2:ability',{fieldIndex:f-1,handIndex:h-1})}}function end(){const me=state?.players[state.you];if(!me||state.status!=='playing'||state.current!==state.you)return;socket.emit('v2:preview-end',{code:document.querySelector('#code').value},r=>{if(!r?.ok){document.querySelector('#error').textContent=r?.error||'無法預覽';return}let qinBottomIndex=null,drawn=[...r.drawn];if(r.qin&&drawn.length===3){const raw=prompt('秦始皇：從新抽三張牌中選一張放回牌庫底部（輸入 1–3）：\\n'+drawn.map((u,i)=>(i+1)+'. '+u.rank+typeLabel(u.type)).join('\\n'),'3');if(raw===null)return;const n=Number(raw);if(!Number.isInteger(n)||n<1||n>3)return alert('請選擇 1–3');qinBottomIndex=n-1;drawn.splice(qinBottomIndex,1)}const combined=[...r.hand,...drawn];const excess=Math.max(0,combined.length-5);let overflowDiscardIndices=[];if(excess){const raw=prompt('抽牌後超過手牌上限 5 張，請選擇 '+excess+' 張棄置（以逗號分隔）：\\n'+combined.map((u,i)=>(i+1)+'. '+u.rank+u.type).join('\\n'));if(raw===null)return;overflowDiscardIndices=raw.split(',').map(x=>Number(x.trim())-1);if(overflowDiscardIndices.length!==excess||new Set(overflowDiscardIndices).size!==excess||overflowDiscardIndices.some(i=>!Number.isInteger(i)||i<0||i>=combined.length))return alert('超額棄牌選擇無效')}send('v2:end',{qinBottomIndex,overflowDiscardIndices})})}

// Page-native discard wizard. Preview comes from the authoritative server;
// card IDs, available draws and limits are never invented in the UI.
function chooseEnd(){if(!state||state.status!=='playing'||state.current!==state.you||state.pendingAttack)return;socket.emit('v2:preview-end',{code:document.querySelector('#code').value},r=>{if(!r?.ok){document.querySelector('#error').textContent=r?.error||'預覽失敗';return}endDraft={preview:r,qinBottomIndex:null,discard:[]};render();document.querySelector('#end-choice')?.scrollIntoView({block:'nearest'})})}
function endDraftCards(){if(!endDraft)return null;const p=endDraft.preview;const drawn=p.drawn.filter((_,i)=>i!==endDraft.qinBottomIndex);return [...p.hand,...drawn]}
function endDraftReady(){if(!endDraft)return false;const p=endDraft.preview;if(p.qin&&p.drawn.length===3&&endDraft.qinBottomIndex===null)return false;const cards=endDraftCards();return endDraft.discard.length===Math.max(0,cards.length-5)}
function selectQinCard(i){if(!endDraft||!endDraft.preview.qin||!Number.isInteger(i)||i<0||i>=endDraft.preview.drawn.length)return;endDraft.qinBottomIndex=i;endDraft.discard=[];render()}
function toggleEndDiscard(i){const cards=endDraftCards();if(!cards||!Number.isInteger(i)||i<0||i>=cards.length)return;const selectedDiscard=endDraft.discard;const j=selectedDiscard.indexOf(i);if(j>=0)selectedDiscard.splice(j,1);else if(selectedDiscard.length<Math.max(0,cards.length-5))selectedDiscard.push(i);render()}
function cancelEndChoice(){endDraft=null;render()}
function submitEndChoice(){if(!endDraftReady())return;const draft=endDraft;endDraft=null;send('v2:end',{qinBottomIndex:draft.qinBottomIndex,overflowDiscardIndices:[...draft.discard].sort((a,b)=>a-b)});render()}
function endDraftMarkup(){if(!endDraft)return '';const p=endDraft.preview,needsQin=p.qin&&p.drawn.length===3&&endDraft.qinBottomIndex===null,combined=needsQin?[]:endDraftCards(),need=Math.max(0,combined.length-5),count=endDraft.discard.length;const panel=needsQin?'<p>秦始皇：從新抽三張兵種中，點擊一張放回牌庫底部。</p><div>'+p.drawn.map((u,i)=>'<button class="card choice-card" onclick="selectQinCard('+i+')">'+safe(u.rank+typeLabel(u.type))+'｜放回牌庫底</button>').join('')+'</div>':'<p class="choice-progress">請選擇 '+need+' 張棄牌｜已選 '+count+' / '+need+'</p><div>'+combined.map((u,i)=>'<button class="card choice-card '+(endDraft.discard.includes(i)?'picked':'')+'" aria-pressed="'+endDraft.discard.includes(i)+'" onclick="toggleEndDiscard('+i+')">'+safe(u.rank+typeLabel(u.type))+' '+(endDraft.discard.includes(i)?'✓ 棄置':'保留')+'</button>').join('')+'</div>';return '<section id="end-choice" aria-label="回合末抽牌與棄牌選擇"><h2>結束回合｜抽牌與手牌整理</h2>'+panel+'<div class="choice-controls"><button onclick="submitEndChoice()" '+(!endDraftReady()?'disabled':'')+'>確認結束回合</button><button onclick="cancelEndChoice()">取消選擇</button></div></section>'}

/* V2 page-native combat choices; server decides every legality and effect. */
function openTactic(kind){if(!state||state.status!=='playing'||state.current!==state.you||state.pendingAttack)return;magicDraft=null;endDraft=null;tacticDraft={kind,attackerIndex:null,defenderPlayerIndex:null,defenderIndex:null,fieldIndex:null,handIndex:null,alexander:false};render();document.querySelector('#tactic-choice')?.scrollIntoView({block:'nearest'})}
function chooseTactic(field,value){if(!tacticDraft)return;if(!['attackerIndex','defenderPlayerIndex','defenderIndex','fieldIndex','handIndex'].includes(field))return;if(!Number.isInteger(value)||value<0)return;tacticDraft[field]=value;if(field==='defenderPlayerIndex'){tacticDraft.defenderIndex=null;tacticDraft.targetKing=false}render()}
function chooseTacticKing(){if(!tacticDraft)return;tacticDraft.defenderIndex=null;tacticDraft.targetKing=true;render()}
function chooseTacticUnit(i){if(!tacticDraft)return;tacticDraft.defenderIndex=i;tacticDraft.targetKing=false;render()}
function toggleTacticAlexander(){if(!tacticDraft)return;tacticDraft.alexander=!tacticDraft.alexander;render()}
function cancelTactic(){tacticDraft=null;render()}
function submitTactic(){if(!tacticDraft||!state)return;const d=tacticDraft,me=state.players[state.you];if(d.kind==='attack'){if(d.attackerIndex===null||d.defenderPlayerIndex===null||(!d.targetKing&&d.defenderIndex===null))return;send('v2:attack',{attackerIndex:d.attackerIndex,defenderPlayerIndex:d.defenderPlayerIndex,defenderIndex:d.targetKing?null:d.defenderIndex,alexander:!d.targetKing&&me.king==='亞歷山大大帝'&&d.alexander})}else if(d.kind==='ability'){if(d.fieldIndex===null||(me.king==='成吉思汗'&&d.handIndex===null))return;send('v2:ability',{fieldIndex:d.fieldIndex,handIndex:d.handIndex})}tacticDraft=null;render()}
function tacticsMarkup(){
 if(!tacticDraft||!state)return '';const d=tacticDraft,me=state.players[state.you];let body='';
 if(d.kind==='attack'){
   body='<p class="tactic-step">① 選擇我方攻擊兵種</p><div class="tactic-grid">'+me.field.map((u,i)=>'<button class="card '+(d.attackerIndex===i?'tactic-selected':'')+'" onclick="chooseTactic(\'attackerIndex\','+i+')" '+(u.tapped||u.justDeployed?'disabled':'')+'>'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'</button>').join('')+'</div>';
   body+='<p class="tactic-step">② 選擇敵方玩家</p><div class="tactic-grid">'+state.players.map((p,i)=>i===state.you||p.hp<=0?'':'<button class="'+(d.defenderPlayerIndex===i?'tactic-selected':'')+'" onclick="chooseTactic(\'defenderPlayerIndex\','+i+')">'+safe(p.name)+'｜'+p.hp+' HP</button>').join('')+'</div>';
   if(d.defenderPlayerIndex!==null){const enemy=state.players[d.defenderPlayerIndex];body+='<p class="tactic-step">③ 選擇兵種或直擊國王</p><div class="tactic-grid">'+enemy.field.map((u,i)=>'<button class="card '+(!d.targetKing&&d.defenderIndex===i?'tactic-selected':'')+'" onclick="chooseTacticUnit('+i+')">'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'</button>').join('')+'<button class="'+(d.targetKing?'tactic-selected':'')+'" onclick="chooseTacticKing()">直擊 '+safe(enemy.name)+' 國王</button></div>'}
   if(me.king==='亞歷山大大帝'&&!me.abilityUsed&&!d.targetKing)body+='<label><input type="checkbox" '+(d.alexander?'checked':'')+' onchange="toggleTacticAlexander()">此戰使用亞歷山大 +1 戰力</label>';
 }else if(d.kind==='ability'){
   if(!['成吉思汗','路易十四'].includes(me.king))return '';
   body='<p class="tactic-step">① 選擇要'+(me.king==='路易十四'?'犧牲':'交換')+'的場上兵種</p><div class="tactic-grid">'+me.field.map((u,i)=>'<button class="card '+(d.fieldIndex===i?'tactic-selected':'')+'" onclick="chooseTactic(\'fieldIndex\','+i+')">'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'</button>').join('')+'</div>';
   if(me.king==='成吉思汗')body+='<p class="tactic-step">② 選擇交換進場的手牌</p><div class="tactic-grid">'+(me.hand||[]).map((u,i)=>'<button class="card '+(d.handIndex===i?'tactic-selected':'')+'" onclick="chooseTactic(\'handIndex\','+i+')">'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'</button>').join('')+'</div>';
 }
 const ready=d.kind==='attack'?d.attackerIndex!==null&&d.defenderPlayerIndex!==null&&(d.targetKing||d.defenderIndex!==null):d.fieldIndex!==null&&(me.king!=='成吉思汗'||d.handIndex!==null);
 return '<section id="tactic-choice" aria-label="戰術操作選擇"><h2>'+ (d.kind==='attack'?'兵種攻擊｜戰術目標':'國王能力｜'+safe(me.king))+'</h2>'+body+'<p><button onclick="submitTactic()" '+(!ready?'disabled':'')+'>確認戰術操作</button><button onclick="cancelTactic()">取消戰術選擇</button></p></section>';
}
function respondAttack(index){send('v2:respond-attack',{handIndex:index})}
function pickOpponent(){const choices=state.players.map((p,i)=>({p,i})).filter(x=>x.i!==state.you&&x.p.hp>0);if(!choices.length)return null;if(choices.length===1)return choices[0].i;const raw=prompt('選擇魔法對象玩家編號：\n'+choices.map(x=>(x.i+1)+'. '+x.p.name).join('\n'));if(raw===null)return null;const n=Number(raw)-1;return choices.some(x=>x.i===n)?n:null}
function cast(i){if(!state||state.current!==state.you||state.pendingAttack)return;const me=state.players[state.you],magic=me.availableSpells[i];const raw=prompt('施法法師：輸入場上序號（1 起算）');if(raw===null)return;const mage=Number(raw);if(!Number.isInteger(mage)||mage<1||mage>me.field.length)return alert('法師序號錯誤');let targets=[];if(magic.maxTargets){const side=magic.target==='self'?'我方':'敵方';const text=prompt(side+'場上目標序號（1 起算；流星雨可用逗號分隔，最多 '+magic.maxTargets+' 名）');if(text===null)return;targets=text.split(',').map(x=>Number(x.trim())-1);if(targets.some(x=>!Number.isInteger(x)||x<0))return alert('目標序號錯誤')}const defenderPlayerIndex=pickOpponent();if(defenderPlayerIndex===null)return;send('v2:cast',{magicIndex:i,mageIndex:mage-1,targetIndices:targets,defenderPlayerIndex})}

/* Page-native spell wizard, with all final legality enforced by the V2 server. */
function openMagic(i){if(!state||state.status!=='playing'||state.current!==state.you||state.pendingAttack)return;const spell=state.players[state.you]?.availableSpells?.[i];if(!spell)return;tacticDraft=null;endDraft=null;const firstOpponent=state.players.findIndex((p,j)=>j!==state.you&&p.hp>0);magicDraft={magicIndex:i,mageIndex:null,defenderPlayerIndex:spell.target==='self'?firstOpponent:null,targetIndices:[]};render();document.querySelector('#magic-choice')?.scrollIntoView({block:'nearest'})}
function chooseMagicMage(i){if(!magicDraft)return;magicDraft.mageIndex=i;render()}
function chooseMagicOpponent(i){if(!magicDraft)return;magicDraft.defenderPlayerIndex=i;magicDraft.targetIndices=[];render()}
function chooseMagicTarget(i){if(!magicDraft||!state)return;const def=state.players[state.you].availableSpells[magicDraft.magicIndex];if(!def||def.maxTargets===0)return;const selected=magicDraft.targetIndices;const found=selected.indexOf(i);if(found>=0)selected.splice(found,1);else if(selected.length<def.maxTargets)selected.push(i);render()}
function cancelMagicChoice(){magicDraft=null;render()}
function submitMagicChoice(){if(!magicDraft||!state)return;const d=magicDraft,spell=state.players[state.you].availableSpells[d.magicIndex];if(d.mageIndex===null||d.defenderPlayerIndex===null||!spell||(spell.maxTargets>0&&d.targetIndices.length===0))return;magicDraft=null;send('v2:cast',{magicIndex:d.magicIndex,mageIndex:d.mageIndex,defenderPlayerIndex:d.defenderPlayerIndex,targetIndices:[...d.targetIndices].sort((a,b)=>a-b)});render()}
function magicChoiceMarkup(){
 if(!magicDraft||!state)return '';const d=magicDraft,me=state.players[state.you],spell=me.availableSpells?.[d.magicIndex];if(!spell)return '';
 let body='<p class="spell-step">① 選擇符合階級的魔法師｜'+safe(spell.name)+'（'+spell.level+' 級）</p><div class="spell-grid">'+me.field.map((u,i)=>{const level=({初級:1,中級:2,高級:3})[u.rank]||0,can=u.type==='法師'&&!u.tapped&&level>=spell.level;return '<button class="card '+(d.mageIndex===i?'spell-picked':'')+'" onclick="chooseMagicMage('+i+')" '+(can?'':'disabled')+'>'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'</button>'}).join('')+'</div>';
 if(spell.target==='enemy')body+='<p class="spell-step">② 選擇受影響的敵方玩家</p><div class="spell-grid">'+state.players.map((p,i)=>i===state.you||p.hp<=0?'':'<button class="'+(d.defenderPlayerIndex===i?'spell-picked':'')+'" onclick="chooseMagicOpponent('+i+')">'+safe(p.name)+'｜'+p.hp+' HP</button>').join('')+'</div>';else body+='<p class="spell-step">② 此魔法作用於我方兵種，無須選擇敵方玩家。</p>';
 if(d.defenderPlayerIndex!==null&&spell.maxTargets>0){const targetPlayer=spell.target==='self'?me:state.players[d.defenderPlayerIndex];body+='<p class="spell-step">③ 選擇'+(spell.target==='self'?'我方':'敵方')+'兵種｜'+d.targetIndices.length+' / '+spell.maxTargets+'</p><div class="spell-grid">'+targetPlayer.field.map((u,i)=>'<button class="card '+(d.targetIndices.includes(i)?'spell-picked':'')+'" aria-pressed="'+d.targetIndices.includes(i)+'" onclick="chooseMagicTarget('+i+')">'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'</button>').join('')+'</div>'}
 else if(spell.maxTargets===0)body+='<p class="spell-step">此魔法自動作用於合法對象，無須指定場上兵種。</p>';
 const ready=d.mageIndex!==null&&d.defenderPlayerIndex!==null&&(spell.maxTargets===0||d.targetIndices.length>=1);
 return '<section id="magic-choice" aria-label="魔法施放選擇"><h2>魔法｜'+safe(spell.name)+'</h2>'+body+'<p><button onclick="submitMagicChoice()" '+(!ready?'disabled':'')+'>確認施放魔法</button><button onclick="cancelMagicChoice()">取消施法</button></p></section>';
}
function renderHud(){const hud=document.querySelector('#battle-hud');if(!state){hud.style.display='none';return}hud.style.display='block';const mine=state.current===state.you;document.querySelector('#hud-turn').textContent=state.status==='finished'?'對局結束':state.status==='waiting'?'等待玩家加入':mine?'你的回合｜可以行動':'等待 '+(state.players[state.current]?.name||'對手')+' 行動';document.querySelector('#hud-status').textContent='回合 '+state.turn+'｜'+(state.pendingAttack?'等待保牌回應':mine?'選擇手牌部署或場上兵種攻擊':'查看戰局');document.querySelector('#hud-players').textContent='存活 '+state.players.filter(p=>p.hp>0).length+' / '+state.players.length+' 人'}
function render(){if(!state)return;renderHud();const me=state.players[state.you],turn=state.current===state.you,pending=state.pendingAttack;const defensePrompt=pending&&pending.defenderIndex===state.you?'<section><h2>敵方直擊國王：選擇保牌</h2><button onclick="respondAttack(null)">不保牌，承受傷害</button>'+((me.hand||[]).map((u,i)=>'<button class="card" onclick="respondAttack('+i+')">使用 '+safe(u.rank+u.type)+' 保牌</button>').join(''))+'</section>':'';const opponents=state.players.map((p,i)=>({p,i})).filter(x=>x.i!==state.you).map(({p,i})=>'<section><h2>'+safe(p.name)+'｜'+p.hp+' HP'+(p.hp<=0?'（已淘汰）':'')+'</h2><div>場上：'+p.field.map((u,j)=>legacyMode?'<button class="card" onclick="hit('+j+','+i+')" '+(p.hp<=0?'disabled':'')+'>'+safe(u.rank+u.type)+'</button>':'<span class="card" data-art-id="'+safe(unitArtId(u))+'">'+classEmblem(u.type)+' '+safe(u.rank+typeLabel(u.type))+'</span>').join('')+'</div>'+(legacyMode?'<button onclick="kingHit('+i+')" '+(p.hp<=0?'disabled':'')+'>攻擊此國王</button>':'')+'</section>').join('');document.querySelector('#game').innerHTML=defensePrompt+'<section id="quick-actions" aria-label="主要回合操作" style="position:sticky;top:65px;z-index:3;background:#211a34f5;border:2px solid #e9c78b;box-shadow:0 6px 22px #0008"><strong>本回合操作</strong><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button onclick="openTactic(&quot;attack&quot;)" '+(!turn||!!pending||!me.field.some(u=>!u.tapped&&!u.justDeployed)?'disabled':'')+'>⚔️ 攻擊兵種／國王</button><button onclick="chooseEnd()" '+(!turn||!!pending?'disabled':'')+'>✓ 結束回合／補牌</button><button onclick="openTactic(&quot;ability&quot;)" '+(!turn||!!pending||me.abilityUsed||!['成吉思汗','路易十四'].includes(me.king)?'disabled':'')+'>♛ 國王能力</button></div><p class="muted" style="margin:8px 0 0">'+(pending?'等待保牌回應；暫時不能進行其他操作。':!turn?'目前不是你的回合。':me.field.length>=3?'場上已滿（3/3）；新部署兵種要等下回合才能攻擊。':'先部署兵種；新部署兵種要等下回合才能攻擊。')+'</p></section>'+'<section><p>兵種克制：步兵 → 刺客 → 魔法師 → 騎兵 → 步兵（克制戰力 +1）</p><div class="class-legend"><span>🛡️ 步兵｜盾牌</span><span>🗡️ 刺客｜短刃</span><span>🔮 魔法師｜法器</span><span>🐎 騎兵｜坐騎</span></div></section><section>房間 '+safe(state.code)+'｜'+state.status+'｜回合 '+state.turn+(state.winner?'｜勝者 '+safe(state.winner):'')+'</section>'+opponents+'<section><div class="player-identity"><h2>我方 '+safe(me.name)+'｜'+safe(me.king)+' '+(turn?'（你的回合）':'')+'</h2><span class="hp-display">♥ '+me.hp+' / 24 HP</span></div><p class="action-help">'+(turn?'先點選手牌部署；要攻擊請按「可視化攻擊／選目標」，再選我方兵種與敵方目標。':'等待其他玩家行動，手牌只對你顯示。')+'</p><p class="muted">國王能力：'+safe(KING_INFO[me.king]||'')+'</p><h3 class="phase-label">我方戰場｜'+me.field.length+' / 3（點擊選擇攻擊者）</h3><div class="field-zone">'+me.field.map((u,i)=>card(u,i,'select')).join('')+'</div>'+'<h3 class="phase-label">我的手牌｜'+(me.hand||[]).length+' / 5（點擊部署）</h3><div class="hand-area">'+(me.hand||[]).map((u,i)=>card(u,i,'deploy')).join('')+'</div>'+'<h3>可選魔法（點擊施放）</h3>'+(me.availableSpells||[]).map((m,i)=>(legacyMode?'<button class="card" onclick="cast('+i+')">'+safe(m.name)+'｜'+m.level+'級魔法</button>':'')+'<button class="card" onclick="openMagic('+i+')" '+(!turn||!!pending?'disabled':'')+'>可視化施放｜'+safe(m.name)+'</button>').join('')+'<p>'+(legacyMode?'<button onclick="ability()" '+(!turn||me.abilityUsed||!['路易十四','成吉思汗'].includes(me.king)?'disabled':'')+'>使用國王能力</button><button onclick="end()" '+(!turn?'disabled':'')+'>結束回合</button>':'')+'<button onclick="chooseEnd()" '+(!turn?'disabled':'')+'>結束回合／補牌</button><button onclick="openTactic(&quot;attack&quot;)" '+(!turn||!!pending?'disabled':'')+'>攻擊兵種／國王</button><button onclick="openTactic(&quot;ability&quot;)" '+(!turn||!!pending||me.abilityUsed||!['成吉思汗','路易十四'].includes(me.king)?'disabled':'')+'>國王能力</button></p></section><section><h3>對局紀錄</h3>'+state.log.map(x=>'<p>'+safe(x)+'</p>').join('')+'</section>';document.querySelector('#game').insertAdjacentHTML('beforeend',endDraftMarkup()+tacticsMarkup()+magicChoiceMarkup())}
socket.on('v2:room-closed',x=>{state=null;document.querySelector('#game').textContent='';renderHud();document.querySelector('#error').textContent=x.message||'房間已關閉'});
socket.on('disconnect',()=>{document.querySelector('#error').textContent='連線中斷，正在重新連線；目前對局可能已結束'});
socket.on('connect',()=>{document.querySelector('#error').textContent='';resumeSeat()});
socket.on('v2:state',s=>{state=s;selected=null;endDraft=null;tacticDraft=null;magicDraft=null;render()});
</script></html>
