<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國王戰爭 V2 基礎對戰測試</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 14px;background:#111827;color:#f9fafb}button,input{font:inherit;padding:9px;margin:4px;border-radius:6px}button{cursor:pointer}section{background:#1f2937;padding:14px;border-radius:12px;margin:12px 0}.card{display:inline-block;padding:12px;border:1px solid #6b7280;border-radius:8px;margin:5px;cursor:pointer}.selected{outline:3px solid #fbbf24}.muted{color:#9ca3af}#error{color:#fca5a5}</style><h1>國王戰爭 V2｜雙人基礎對戰</h1><p class="muted">開發測試版：部署、兵種戰鬥、攻擊國王、補牌、勝負判定。九種魔法已開放測試；尚未包含完整介面；國王能力已提供初步操作。</p><section><input id="name" placeholder="玩家名稱" value="測試玩家"><select id="king"><option>亞歷山大大帝</option><option>屋大維奧古斯都</option><option>成吉思汗</option><option>秦始皇</option><option>路易十四</option></select><button onclick="create()">建立房間</button><input id="code" placeholder="房間代碼"><button onclick="join()">加入房間</button><button onclick="start()">開始對戰</button><div id="error"></div></section><div id="game"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io('/v2-playtest');let state=null,selected=null;
const KING_INFO={'亞歷山大大帝':'每回合一次：兵種戰鬥時攻擊戰力 +1（點擊敵方兵種時選擇）','屋大維奧古斯都':'被動：戰力相同的兵種戰鬥中，己方防守兵種存活並進入半整備','成吉思汗':'每回合一次：交換一張場上兵種與一張手牌；換入兵種本回合不可行動','秦始皇':'每次回合結束時額外抽一張兵種，從四張候選牌選一張放回牌庫底','路易十四':'每回合一次：犧牲回合開始時已在場上的一名兵種，恢復國王 3 HP（不超過 24）'};
function send(event,data){socket.emit(event,{...data,code:document.querySelector('#code').value},r=>{if(!r?.ok)document.querySelector('#error').textContent=r?.error||'操作失敗';else document.querySelector('#error').textContent='';if(r?.code)document.querySelector('#code').value=r.code})}
function create(){send('v2:create',{name:document.querySelector('#name').value,king:document.querySelector('#king').value})}function join(){send('v2:join',{name:document.querySelector('#name').value,king:document.querySelector('#king').value})}function start(){send('v2:start',{})}
function safe(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function card(u,i,action){return '<button class="card '+(selected===i&&action==='select'?'selected':'')+'" onclick="'+action+'('+i+')">'+safe(u.rank+u.type)+'｜戰力 '+( ({初級:1,中級:2,高級:3}[u.rank]||0)+(u.modifier||0))+(u.halfReadyUntilOwnerTurn?'（半整備）':'')+(u.tapped?'（已行動）':'')+(u.status?.length?'｜狀態：'+safe([...new Set(u.status)].join('、')):'')+'</button>'}
function select(i){selected=i;render()}function deploy(i){send('v2:deploy',{index:i})}function hit(i){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected,defenderIndex:i,alexander:state.players[state.you].king==='亞歷山大大帝'&&!state.players[state.you].abilityUsed&&confirm('使用亞歷山大 +1 戰力？')});selected=null}function kingHit(){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected});selected=null}function ability(){if(!state)return;const me=state.players[state.you];if(me.king==='路易十四'){const raw=prompt('犧牲哪一張場上兵種？輸入 1 起算的序號');if(raw===null)return;const i=Number(raw);if(Number.isInteger(i)&&i>=1&&i<=me.field.length)send('v2:ability',{fieldIndex:i-1})}else if(me.king==='成吉思汗'){const fr=prompt('交換場上兵種序號（從 1 開始）');if(fr===null)return;const hr=prompt('交換手牌序號（從 1 開始）');if(hr===null)return;const f=Number(fr),h=Number(hr);if(Number.isInteger(f)&&Number.isInteger(h)&&f>=1&&f<=me.field.length&&h>=1&&h<=me.hand.length)send('v2:ability',{fieldIndex:f-1,handIndex:h-1})}}function end(){const me=state?.players[state.you];if(!me||state.status!=='playing'||state.current!==state.you)return;const discard=[];if(me.hand?.length&&confirm('回合結束前要棄掉手牌並重新補滿嗎？')){const raw=prompt('輸入要棄掉的手牌序號，以逗號分隔（例如 1,3）。留空表示不棄牌','');if(raw===null)return;if(raw.trim()){for(const part of raw.split(',')){const n=Number(part.trim());if(!Number.isInteger(n)||n<1||n>me.hand.length||discard.includes(n-1)){alert('棄牌序號無效或重複');return}discard.push(n-1)}}}let qinBottomIndex=null;if(me?.king==='秦始皇'){socket.emit('v2:preview-end',{code:document.querySelector('#code').value,discard},r=>{if(!r?.ok){document.querySelector('#error').textContent=r?.error||'無法預覽';return}if(!r.hasExtra){send('v2:end',{discard,qinBottomIndex:null});return}const cards=r.choices.map((u,i)=>(i+1)+'. '+u.rank+u.type).join('\n');const raw=prompt('秦始皇：四張候選牌如下，選擇一張放回牌庫底（1–4）：\n'+cards,'4');if(raw===null)return;const n=Number(raw);if(!Number.isInteger(n)||n<1||n>4){alert('請選擇 1–4');return}send('v2:end',{discard,qinBottomIndex:n-1})});return}send('v2:end',{discard,qinBottomIndex})}
function respondAttack(index){send('v2:respond-attack',{handIndex:index})}
function cast(i){if(!state||state.current!==state.you)return;const me=state.players[state.you],magic=me.availableSpells[i];const raw=prompt('施法法師：輸入場上序號（1 起算）');if(raw===null)return;const mage=Number(raw);if(!Number.isInteger(mage)||mage<1||mage>me.field.length)return alert('法師序號錯誤');let targets=[];if(magic.maxTargets){const side=magic.target==='self'?'我方':'敵方';const text=prompt(side+'場上目標序號（1 起算；流星雨可用逗號分隔，最多 '+magic.maxTargets+' 名）');if(text===null)return;targets=text.split(',').map(x=>Number(x.trim())-1);if(targets.some(x=>!Number.isInteger(x)||x<0))return alert('目標序號錯誤')}send('v2:cast',{magicIndex:i,mageIndex:mage-1,targetIndices:targets})}
function render(){if(!state)return;const me=state.players[state.you],enemy=state.players[1-state.you],turn=state.current===state.you;document.querySelector('#game').innerHTML='<section>兵種克制：步兵 → 刺客 → 魔法師 → 騎兵 → 步兵（克制戰力 +1）</section><section>房間 '+safe(state.code)+'｜'+state.status+'｜回合 '+state.turn+(state.winner?'｜勝者 '+safe(state.winner):'')+'</section>'+(enemy?'<section><h2>對手 '+safe(enemy.name)+'｜'+enemy.hp+' HP</h2><div>場上：'+enemy.field.map((u,i)=>card(u,i,'hit')).join('')+'</div><button onclick="kingHit()">攻擊對手國王</button></section>':'<section>等待第二位玩家加入</section>')+'<section><h2>我方 '+safe(me.name)+'｜'+me.hp+' HP｜'+safe(me.king)+' '+(turn?'（你的回合）':'')+'</h2><p class="muted">國王能力：'+safe(KING_INFO[me.king]||'')+'</p><h3>場上（點擊選擇攻擊者）</h3>'+me.field.map((u,i)=>card(u,i,'select')).join('')+'<h3>手牌（點擊部署）</h3>'+(me.hand||[]).map((u,i)=>card(u,i,'deploy')).join('')+'<h3>可選魔法（點擊施放）</h3>'+(me.availableSpells||[]).map((m,i)=>'<button class="card" onclick="cast('+i+')">'+safe(m.name)+'｜'+m.level+'級魔法｜'+(m.target==='self'?'我方':m.target==='enemy'?'敵方':'敵方全場')+'</button>').join('')+'<p><button onclick="ability()" '+(!turn||me.abilityUsed||!['路易十四','成吉思汗'].includes(me.king)?'disabled':'')+'>使用國王能力</button><button onclick="end()" '+(!turn?'disabled':'')+'>結束回合</button></p></section><section><h3>對局紀錄</h3>'+state.log.map(x=>'<p>'+safe(x)+'</p>').join('')+'</section>'}
socket.on('v2:room-closed',x=>{state=null;document.querySelector('#game').textContent='';document.querySelector('#error').textContent=x.message||'房間已關閉'});
socket.on('disconnect',()=>{document.querySelector('#error').textContent='連線中斷，正在重新連線；目前對局可能已結束'});
socket.on('connect',()=>{document.querySelector('#error').textContent=''});
socket.on('v2:state',s=>{state=s;selected=null;render()});
</script></html>
