<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國王戰爭 V2 基礎對戰測試</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 14px;background:#111827;color:#f9fafb}button,input{font:inherit;padding:9px;margin:4px;border-radius:6px}button{cursor:pointer}section{background:#1f2937;padding:14px;border-radius:12px;margin:12px 0}.card{display:inline-block;padding:12px;border:1px solid #6b7280;border-radius:8px;margin:5px;cursor:pointer}.selected{outline:3px solid #fbbf24}.muted{color:#9ca3af}#error{color:#fca5a5}</style><h1>國王戰爭 V2｜雙人基礎對戰</h1><p class="muted">開發測試版：部署、兵種戰鬥、攻擊國王、補牌、勝負判定。尚未包含魔法、國王能力與完整介面。</p><section><input id="name" placeholder="玩家名稱" value="測試玩家"><button onclick="create()">建立房間</button><input id="code" placeholder="房間代碼"><button onclick="join()">加入房間</button><button onclick="start()">開始對戰</button><div id="error"></div></section><div id="game"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io('/v2-playtest');let state=null,selected=null;
function send(event,data){socket.emit(event,{...data,code:document.querySelector('#code').value},r=>{if(!r?.ok)document.querySelector('#error').textContent=r?.error||'操作失敗';else document.querySelector('#error').textContent='';if(r?.code)document.querySelector('#code').value=r.code})}
function create(){send('v2:create',{name:document.querySelector('#name').value})}function join(){send('v2:join',{name:document.querySelector('#name').value})}function start(){send('v2:start',{})}
function card(u,i,action){return '<button class="card '+(selected===i&&action==='select'?'selected':'')+'" onclick="'+action+'('+i+')">'+u.rank+u.type+(u.tapped?'（已行動）':'')+'</button>'}
function select(i){selected=i;render()}function deploy(i){send('v2:deploy',{index:i})}function hit(i){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected,defenderIndex:i});selected=null}function kingHit(){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected});selected=null}function end(){send('v2:end',{discard:[]})}
function render(){if(!state)return;const me=state.players[state.you],enemy=state.players[1-state.you],turn=state.current===state.you;document.querySelector('#game').innerHTML='<section>房間 '+state.code+'｜'+state.status+'｜回合 '+state.turn+(state.winner?'｜勝者 '+state.winner:'')+'</section>'+(enemy?'<section><h2>對手 '+enemy.name+'｜'+enemy.hp+' HP</h2><div>場上：'+enemy.field.map((u,i)=>card(u,i,'hit')).join('')+'</div><button onclick="kingHit()">攻擊對手國王</button></section>':'<section>等待第二位玩家加入</section>')+'<section><h2>我方 '+me.name+'｜'+me.hp+' HP '+(turn?'（你的回合）':'')+'</h2><h3>場上（點擊選擇攻擊者）</h3>'+me.field.map((u,i)=>card(u,i,'select')).join('')+'<h3>手牌（點擊部署）</h3>'+(me.hand||[]).map((u,i)=>card(u,i,'deploy')).join('')+'<p><button onclick="end()" '+(!turn?'disabled':'')+'>結束回合</button></p></section><section><h3>對局紀錄</h3>'+state.log.map(x=>'<p>'+x.replaceAll('<','&lt;')+'</p>').join('')+'</section>'}
socket.on('v2:state',s=>{state=s;selected=null;render()});
</script></html>
