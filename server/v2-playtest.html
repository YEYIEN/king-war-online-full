<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國王戰爭 V2 基礎對戰測試</title><style>
:root{color-scheme:dark;--ink:#fff7ef;--muted:#c5b8ce;--gold:#e9c78b;--line:#806d91;--panel:rgba(37,27,60,.88)}
*{box-sizing:border-box}body{font-family:"Noto Sans TC",system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:24px 18px 60px;background:radial-gradient(ellipse at 70% 0%,#53406c 0%,transparent 42%),radial-gradient(ellipse at 0% 65%,#323b67 0%,transparent 42%),#151324;color:var(--ink);line-height:1.6}
h1{font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:.08em;color:#ffe6b5;text-shadow:0 3px 22px #bb83c36b}h2,h3{color:#f6dfbc;margin:.2em 0 .6em}section{background:var(--panel);border:1px solid #a68cb66b;box-shadow:0 12px 30px #0b091d55,inset 0 1px #ffffff1c;padding:20px;border-radius:18px;margin:15px 0;backdrop-filter:blur(9px)}
button,input,select{font:inherit;padding:10px 13px;margin:4px;border-radius:10px;border:1px solid #b69dbb;background:#2d2442;color:var(--ink);max-width:100%}input{background:#1c1930}button{cursor:pointer;transition:transform .15s,border-color .15s,background .15s}button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);background:#49375f}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f4c77c;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.card{display:inline-flex;align-items:center;min-height:74px;padding:14px 17px;border:1px solid #c2a2bd;border-radius:14px;margin:6px;background:linear-gradient(145deg,#554268,#2d2546 65%,#25213e);box-shadow:inset 0 1px #ffffff36,0 4px 14px #100b1c66;text-align:left;cursor:pointer;white-space:normal}.selected{outline:3px solid #f5d493;box-shadow:0 0 18px #f6d59a70}.muted{color:var(--muted)}#error{color:#ffb9b9;min-height:1.2em}
@media(max-width:640px){body{padding:14px 10px 36px}section{padding:13px}.card{min-height:60px;padding:10px 12px;margin:4px}button,input,select{font-size:14px}}
@media(prefers-reduced-motion:reduce){button{transition:none}button:hover:not(:disabled){transform:none}}
</style><h1>國王戰爭 V2｜2–5 人對戰測試</h1><p class="muted">開發測試版：部署、兵種戰鬥、攻擊國王、補牌、勝負判定。九種魔法已開放測試；尚未包含完整介面；國王能力已提供初步操作。</p><section><input id="name" placeholder="玩家名稱" value="測試玩家"><select id="king"><option>亞歷山大大帝</option><option>屋大維奧古斯都</option><option>成吉思汗</option><option>秦始皇</option><option>路易十四</option></select><button onclick="create()">建立房間</button><input id="code" placeholder="房間代碼"><button onclick="join()">加入房間</button><button onclick="start()">開始對戰</button><div id="error"></div></section><div id="game"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io('/v2-playtest');let state=null,selected=null;
const resumeKey='kw_v2_resume';
function storeSeat(code,resumeToken){if(code&&resumeToken)sessionStorage.setItem(resumeKey,JSON.stringify({code,resumeToken}))}
function resumeSeat(){let saved;try{saved=JSON.parse(sessionStorage.getItem(resumeKey)||'null')}catch{return}if(!saved?.code||!saved?.resumeToken)return;socket.emit('v2:resume',saved,r=>{if(r?.ok){document.querySelector('#code').value=r.code;storeSeat(r.code,r.resumeToken);document.querySelector('#error').textContent='已恢復遊戲連線'}else{document.querySelector('#error').textContent='無法恢復原對局：'+(r?.error||'請重新加入')}})}

const KING_INFO={'亞歷山大大帝':'每回合一次：兵種戰鬥時攻擊戰力 +1（點擊敵方兵種時選擇）','屋大維奧古斯都':'被動：戰力相同的兵種戰鬥中，己方防守兵種存活並進入半整備','成吉思汗':'每回合一次：交換一張場上兵種與一張手牌；換入兵種本回合不可行動','秦始皇':'每次回合結束時額外抽一張兵種，從新抽三張牌選一張放回牌庫底','路易十四':'每回合一次：犧牲回合開始時已在場上的一名兵種，恢復國王 3 HP（不超過 24）'};
function send(event,data){socket.emit(event,{...data,code:document.querySelector('#code').value},r=>{if(!r?.ok)document.querySelector('#error').textContent=r?.error||'操作失敗';else document.querySelector('#error').textContent='';if(r?.code)document.querySelector('#code').value=r.code;if(r?.ok&&r?.resumeToken)storeSeat(r.code||document.querySelector('#code').value,r.resumeToken)})}
function create(){send('v2:create',{name:document.querySelector('#name').value,king:document.querySelector('#king').value})}function join(){send('v2:join',{name:document.querySelector('#name').value,king:document.querySelector('#king').value})}function start(){send('v2:start',{})}
function safe(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function typeLabel(type){return ({'弓兵':'刺客','法師':'魔法師'})[type]||type}function card(u,i,action){return '<button class="card '+(selected===i&&action==='select'?'selected':'')+'" onclick="'+action+'('+i+')">'+safe(u.rank+typeLabel(u.type))+'｜戰力 '+( ({初級:1,中級:2,高級:3}[u.rank]||0)+(u.modifier||0))+(u.halfReadyUntilOwnerTurn?'（半整備）':'')+(u.tapped?'（已行動）':'')+(u.status?.length?'｜狀態：'+safe([...new Set(u.status)].join('、')):'')+'</button>'}
function select(i){selected=i;render()}function deploy(i){send('v2:deploy',{index:i})}function hit(i,defenderPlayerIndex){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected,defenderIndex:i,defenderPlayerIndex,alexander:state.players[state.you].king==='亞歷山大大帝'&&!state.players[state.you].abilityUsed&&confirm('使用亞歷山大 +1 戰力？')});selected=null}function kingHit(defenderPlayerIndex){if(selected===null)return alert('先選擇我方場上兵種');send('v2:attack',{attackerIndex:selected,defenderPlayerIndex});selected=null}function ability(){if(!state)return;const me=state.players[state.you];if(me.king==='路易十四'){const raw=prompt('犧牲哪一張場上兵種？輸入 1 起算的序號');if(raw===null)return;const i=Number(raw);if(Number.isInteger(i)&&i>=1&&i<=me.field.length)send('v2:ability',{fieldIndex:i-1})}else if(me.king==='成吉思汗'){const fr=prompt('交換場上兵種序號（從 1 開始）');if(fr===null)return;const hr=prompt('交換手牌序號（從 1 開始）');if(hr===null)return;const f=Number(fr),h=Number(hr);if(Number.isInteger(f)&&Number.isInteger(h)&&f>=1&&f<=me.field.length&&h>=1&&h<=me.hand.length)send('v2:ability',{fieldIndex:f-1,handIndex:h-1})}}function end(){const me=state?.players[state.you];if(!me||state.status!=='playing'||state.current!==state.you)return;socket.emit('v2:preview-end',{code:document.querySelector('#code').value},r=>{if(!r?.ok){document.querySelector('#error').textContent=r?.error||'無法預覽';return}let qinBottomIndex=null,drawn=[...r.drawn];if(r.qin&&drawn.length===3){const raw=prompt('秦始皇：從新抽三張牌中選一張放回牌庫底部（輸入 1–3）：\\n'+drawn.map((u,i)=>(i+1)+'. '+u.rank+typeLabel(u.type)).join('\\n'),'3');if(raw===null)return;const n=Number(raw);if(!Number.isInteger(n)||n<1||n>3)return alert('請選擇 1–3');qinBottomIndex=n-1;drawn.splice(qinBottomIndex,1)}const combined=[...r.hand,...drawn];const excess=Math.max(0,combined.length-5);let overflowDiscardIndices=[];if(excess){const raw=prompt('抽牌後超過手牌上限 5 張，請選擇 '+excess+' 張棄置（以逗號分隔）：\\n'+combined.map((u,i)=>(i+1)+'. '+u.rank+u.type).join('\\n'));if(raw===null)return;overflowDiscardIndices=raw.split(',').map(x=>Number(x.trim())-1);if(overflowDiscardIndices.length!==excess||new Set(overflowDiscardIndices).size!==excess||overflowDiscardIndices.some(i=>!Number.isInteger(i)||i<0||i>=combined.length))return alert('超額棄牌選擇無效')}send('v2:end',{qinBottomIndex,overflowDiscardIndices})})}
function respondAttack(index){send('v2:respond-attack',{handIndex:index})}
function pickOpponent(){const choices=state.players.map((p,i)=>({p,i})).filter(x=>x.i!==state.you&&x.p.hp>0);if(!choices.length)return null;if(choices.length===1)return choices[0].i;const raw=prompt('選擇魔法對象玩家編號：\n'+choices.map(x=>(x.i+1)+'. '+x.p.name).join('\n'));if(raw===null)return null;const n=Number(raw)-1;return choices.some(x=>x.i===n)?n:null}
function cast(i){if(!state||state.current!==state.you||state.pendingAttack)return;const me=state.players[state.you],magic=me.availableSpells[i];const raw=prompt('施法法師：輸入場上序號（1 起算）');if(raw===null)return;const mage=Number(raw);if(!Number.isInteger(mage)||mage<1||mage>me.field.length)return alert('法師序號錯誤');let targets=[];if(magic.maxTargets){const side=magic.target==='self'?'我方':'敵方';const text=prompt(side+'場上目標序號（1 起算；流星雨可用逗號分隔，最多 '+magic.maxTargets+' 名）');if(text===null)return;targets=text.split(',').map(x=>Number(x.trim())-1);if(targets.some(x=>!Number.isInteger(x)||x<0))return alert('目標序號錯誤')}const defenderPlayerIndex=pickOpponent();if(defenderPlayerIndex===null)return;send('v2:cast',{magicIndex:i,mageIndex:mage-1,targetIndices:targets,defenderPlayerIndex})}
function render(){if(!state)return;const me=state.players[state.you],turn=state.current===state.you,pending=state.pendingAttack;const defensePrompt=pending&&pending.defenderIndex===state.you?'<section><h2>敵方直擊國王：選擇保牌</h2><button onclick="respondAttack(null)">不保牌，承受傷害</button>'+((me.hand||[]).map((u,i)=>'<button class="card" onclick="respondAttack('+i+')">使用 '+safe(u.rank+u.type)+' 保牌</button>').join(''))+'</section>':'';const opponents=state.players.map((p,i)=>({p,i})).filter(x=>x.i!==state.you).map(({p,i})=>'<section><h2>'+safe(p.name)+'｜'+p.hp+' HP'+(p.hp<=0?'（已淘汰）':'')+'</h2><div>場上：'+p.field.map((u,j)=>'<button class="card" onclick="hit('+j+','+i+')" '+(p.hp<=0?'disabled':'')+'>'+safe(u.rank+u.type)+'</button>').join('')+'</div><button onclick="kingHit('+i+')" '+(p.hp<=0?'disabled':'')+'>攻擊此國王</button></section>').join('');document.querySelector('#game').innerHTML=defensePrompt+'<section>兵種克制：步兵 → 刺客 → 魔法師 → 騎兵 → 步兵（克制戰力 +1）</section><section>房間 '+safe(state.code)+'｜'+state.status+'｜回合 '+state.turn+(state.winner?'｜勝者 '+safe(state.winner):'')+'</section>'+opponents+'<section><h2>我方 '+safe(me.name)+'｜'+me.hp+' HP｜'+safe(me.king)+' '+(turn?'（你的回合）':'')+'</h2><p class="muted">國王能力：'+safe(KING_INFO[me.king]||'')+'</p><h3>場上（點擊選擇攻擊者）</h3>'+me.field.map((u,i)=>card(u,i,'select')).join('')+'<h3>手牌（點擊部署）</h3>'+(me.hand||[]).map((u,i)=>card(u,i,'deploy')).join('')+'<h3>可選魔法（點擊施放）</h3>'+(me.availableSpells||[]).map((m,i)=>'<button class="card" onclick="cast('+i+')">'+safe(m.name)+'｜'+m.level+'級魔法</button>').join('')+'<p><button onclick="ability()" '+(!turn||me.abilityUsed||!['路易十四','成吉思汗'].includes(me.king)?'disabled':'')+'>使用國王能力</button><button onclick="end()" '+(!turn?'disabled':'')+'>結束回合</button></p></section><section><h3>對局紀錄</h3>'+state.log.map(x=>'<p>'+safe(x)+'</p>').join('')+'</section>'}
socket.on('v2:room-closed',x=>{state=null;document.querySelector('#game').textContent='';document.querySelector('#error').textContent=x.message||'房間已關閉'});
socket.on('disconnect',()=>{document.querySelector('#error').textContent='連線中斷，正在重新連線；目前對局可能已結束'});
socket.on('connect',()=>{document.querySelector('#error').textContent='';resumeSeat()});
socket.on('v2:state',s=>{state=s;selected=null;render()});
</script></html>
