<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國王戰爭 R2.1 雙人測試</title><style>body{font:16px system-ui;background:#151b2a;color:#eef2ff;max-width:960px;margin:auto;padding:16px}section{border:1px solid #566481;border-radius:10px;margin:12px 0;padding:12px}button,input,select{font:inherit;padding:7px;margin:3px;border-radius:5px}button{background:#e6cc85;border:0;cursor:pointer}input,select{background:#26344c;color:white;border:1px solid #70809c}.unit{display:inline-block;border:1px solid #7186a6;padding:8px;margin:5px}#error{color:#ffaaaa}small{color:#b9c5d8}</style></head><body><h1>國王戰爭 R2.1｜雙人測試入口</h1><p>獨立測試版，非正式 V1。騎兵突破 1 HP 不可保牌。</p><section><label>國王 <select id="king"><option>亞歷山大</option><option>屋大維</option><option>成吉思汗</option><option>秦始皇</option><option>路易十四</option></select></label><button id="create">建立房間</button><label>房號 <input id="code"></label><button id="join">加入房間</button><button id="resume">重連</button><button id="start">開始對局</button><p id="session">尚未加入</p></section><section><h2 id="status">連線中</h2><div id="players"></div><h3>我的手牌</h3><div id="hand"></div></section><section><h2>操作</h2><label>手牌 <select id="card"></select></label><label>己方位置 <select id="from"><option value="front">前鋒</option><option value="center">中央</option><option value="rear">後衛</option></select></label><label>目標位置 <select id="to"><option value="front">前鋒</option><option value="center">中央</option><option value="rear">後衛</option><option value="king">國王</option></select></label><label>對手 <select id="target"></select></label><p><button id="deploy">部署</button><button id="move">移動</button><button id="attack">攻擊</button><button id="alex">亞歷山大強化攻擊</button><button id="ability">國王能力</button><button id="end">結束回合</button></p><label>魔法 <select id="spell"><option>火球術</option><option>冰凍術</option><option>力量術</option><option>虛弱術</option><option>增強術</option><option>流星雨</option><option>毒藥瓶</option><option>燃血術</option><option>天殞術</option></select></label><button id="cast">施法</button><button id="guard">保牌</button><button id="noGuard">不保牌</button><p><small>施法時「己方位置」為魔法師位置；「目標位置」為受影響兵種位置。力量術／增強術／燃血術目標是己方兵種。移動時「己方位置」為來源、「目標位置」為目的地。</small></p></section><section><p id="error" role="alert"></p><pre id="log"></pre></section><script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),sock=io('/v2-r21');let session=null,state=null;const key='king-war-r21-session';const saved=()=>{try{return JSON.parse(localStorage.getItem(key))}catch{return null}};function save(s){session=s;localStorage.setItem(key,JSON.stringify(s));$('code').value=s.code;$('session').textContent='房間 '+s.code+'｜座位 '+(s.seat+1)}function log(s){$('log').textContent=s+'\n'+$('log').textContent.slice(0,3000)}function err(s){$('error').textContent=s||'';if(s)log(s)}function call(ev,data,fn){sock.timeout(12000).emit(ev,data,(e,r)=>{if(e||!r?.ok)return err(r?.error||'伺服器無回應');err('');fn?.(r)})}function cmd(type,extra={}){if(!session)return err('請先加入房間');call('r21:command',{code:session.code,command:{type,...extra}},()=>log(type+' 成功'))}function opt(el,value,text){let o=document.createElement('option');o.value=value;o.textContent=text;el.append(o)}function render(data){if(!data?.state){$('status').textContent='等待其他玩家／房主開始';return}state=data.state;let p=state.players[session?.seat];$('status').textContent='回合 '+state.turn+'｜行動玩家 '+(state.current+1)+'｜AP '+state.ap+'｜'+(state.phase==='guard'?'等待玩家 '+(state.pending.defenderId+1)+' 保牌':state.phase==='finished'?'勝者：玩家 '+(state.winner+1):'進行中');$('players').replaceChildren();for(let x of state.players){let sec=document.createElement('section'),h=document.createElement('h3');h.textContent='玩家 '+(x.id+1)+'｜'+x.king+'｜HP '+x.hp+'｜手牌 '+x.handCount+' 張';sec.append(h);for(let pos of ['front','center','rear']){let u=x.field[pos],e=document.createElement('span');e.className='unit';e.textContent=({front:'前鋒',center:'中央',rear:'後衛'})[pos]+'：'+(u?u.rank+u.type+' #'+u.id:'空');sec.append(e)}$('players').append(sec)}$('card').replaceChildren();$('hand').replaceChildren();for(let u of p?.hand||[]){opt($('card'),u.id,u.id+' '+u.rank+u.type);let e=document.createElement('span');e.className='unit';e.textContent=u.id+' '+u.rank+u.type;$('hand').append(e)}$('target').replaceChildren();for(let x of state.players)if(x.id!==session?.seat&&x.hp>0)opt($('target'),x.id,'玩家 '+(x.id+1))}
sock.on('connect',()=>{log('Socket 已連線');let s=saved();if(s){save(s);call('r21:resume',s,()=>log('已恢復座位'))}});sock.on('r21:state',render);sock.on('disconnect',()=>log('連線中斷'));$('create').onclick=()=>call('r21:create',{king:$('king').value},save);$('join').onclick=()=>call('r21:join',{code:$('code').value.trim(),king:$('king').value},save);$('resume').onclick=()=>{let s=saved();if(s)call('r21:resume',s,()=>save(s));else err('沒有可恢復的房間')};$('start').onclick=()=>call('r21:start',{code:session?.code},()=>log('遊戲開始'));const card=()=>Number($('card').value),from=()=>$('from').value,to=()=>$('to').value,target=()=>Number($('target').value);$('deploy').onclick=()=>cmd('DEPLOY',{cardId:card(),position:to()});$('move').onclick=()=>cmd('MOVE',{from:from(),to:to()});$('attack').onclick=()=>cmd('ATTACK',{from:from(),to:to(),player:target()});$('alex').onclick=()=>cmd('ATTACK',{from:from(),to:to(),player:target(),alexander:true});$('ability').onclick=()=>cmd('ABILITY',{from:from(),cardId:card()});$('end').onclick=()=>cmd('END');$('cast').onclick=()=>cmd('CAST',{from:from(),to:to(),player:target(),spell:$('spell').value});$('guard').onclick=()=>cmd('GUARD',{cardId:card()});$('noGuard').onclick=()=>cmd('GUARD',{cardId:null});
</script></body></html>
