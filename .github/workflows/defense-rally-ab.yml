name: Defensive rally A-B comparison
on:
  pull_request:
  push:
    branches:
      - feature/game-experience-redesign-20261114
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Test experimental counterattack against control
        env:
          KW_SIMULATION: '1'
          MATCHES_PER_SEED: '500'
        run: node scripts/defense-rally-ab.mjs
