name: Mongol recall strategy A-B
on:
  pull_request:
  push:
    branches:
      - feature/game-experience-redesign-20261114
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Simulate recall policies by player count and AI difficulty
        env:
          KW_SIMULATION: '1'
          MATCHES_PER_SEED: '150'
        run: node scripts/mongol-recall-ab.mjs | tee mongol-recall-ab.json
      - uses: actions/upload-artifact@v4
        with:
          name: mongol-recall-ab
          path: mongol-recall-ab.json
          retention-days: 30
