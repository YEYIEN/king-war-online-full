name: V2 rule validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [rules-v2-tabletop-rebuild]
jobs:
  v2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:v2
      - run: node --check server/index.js
      - run: node --check server/v2-playtest-socket.mjs

  v2-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm --prefix client install --no-audit --no-fund
      - run: node --test tests/v2-network.test.mjs tests/v2-magic-network.test.mjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - run: node --test tests/v2-magic-browser.test.mjs
