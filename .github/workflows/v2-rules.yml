name: V2 rule validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [rules-v2-tabletop-rebuild]
jobs:
  v2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:v2
