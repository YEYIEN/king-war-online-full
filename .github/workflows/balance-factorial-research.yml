name: Balance factor research — AI simulation only
concurrency:
  group: balance-factor-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feature/prebalance-hardening-ai-20261114]
    paths:
      - 'scripts/balance-factorial-research.mjs'
      - '.github/workflows/balance-factorial-research.yml'
      - 'server/**'
  workflow_dispatch:
jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run 30 balanced and experimental scenarios
        env:
          KW_SIMULATION: '1'
          BALANCE_MATCHES_PER_SEED: '250'
        run: node scripts/balance-factorial-research.mjs > balance-factorial-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-factorial-research
          path: |
            balance-factorial-raw.json
            balance-factorial-summary.md
            balance-factorial-output.json
          retention-days: 30
          if-no-files-found: warn
