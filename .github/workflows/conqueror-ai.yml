name: Conqueror AI competition
on:
  pull_request:
  push:
    branches:
      - feature/game-experience-redesign-20261114
jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Unit and integration regression
        run: npm test
      - name: Benchmark AI challenger by opponent and number of players
        env:
          KW_SIMULATION: '1'
          MATCHES_PER_SEED: '300'
        run: node scripts/conqueror-benchmark.mjs | tee conqueror-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: conqueror-results
          path: conqueror-results.json
          retention-days: 30
