name: Game balance simulation
on:
  pull_request:
  push:
    branches:
      - feature/game-experience-redesign-20261114
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix client ci
      - name: Regression tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Two-player baseline (current AI)
        env:
          KW_SIMULATION: '1'
          MATCHES: '300'
          PLAYERS: '2'
        run: node scripts/king-balance-baseline.mjs
      - name: Five-player baseline (current AI)
        env:
          KW_SIMULATION: '1'
          MATCHES: '150'
          PLAYERS: '5'
        run: node scripts/king-balance-baseline.mjs
