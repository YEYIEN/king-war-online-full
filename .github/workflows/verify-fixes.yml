name: Verify King War fixes
on:
  pull_request:
  push:
    branches:
      - fix/lobby-readiness-start-resume-20261112

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server dependencies
        run: npm install
      - name: Install client dependencies
        run: npm --prefix client install
      - name: Run Socket.IO regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
