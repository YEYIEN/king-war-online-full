name: Verify King War fixes
on:
  pull_request:
  push:
    branches:
      - fix/lobby-readiness-start-resume-20261112
      - test/vite8-upgrade-20261112

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm --prefix client install
      - name: Run Socket.IO regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Report dependency advisories
        shell: bash
        run: |
          for scope in root client; do
            if [ "$scope" = "root" ]; then cd "$GITHUB_WORKSPACE"; else cd "$GITHUB_WORKSPACE/client"; fi
            for mode in production all; do
              if [ "$mode" = "production" ]; then
                npm audit --json --omit=dev > "$RUNNER_TEMP/$scope-$mode.json" || true
              else
                npm audit --json > "$RUNNER_TEMP/$scope-$mode.json" || true
              fi
              node -e '
                const fs = require("fs");
                const [scope, mode, file] = process.argv.slice(1);
                const report = JSON.parse(fs.readFileSync(file, "utf8"));
                console.log("AUDIT " + scope + " " + mode + " counts " + JSON.stringify(report.metadata?.vulnerabilities));
                for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
                  console.log("PACKAGE " + name + " severity=" + v.severity + " direct=" + v.isDirect + " affected=" + v.range + " fix=" + JSON.stringify(v.fixAvailable) + " via=" + JSON.stringify(v.via));
                }
              ' "$scope" "$mode" "$RUNNER_TEMP/$scope-$mode.json"
            done
          done

      - name: Commit regenerated Vite 8 lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'test/vite8-upgrade-20261112'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Vite 8 dependency lockfile"
            git push origin HEAD:test/vite8-upgrade-20261112
          fi
